# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M" -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# min_sdk/target_sdk are now resolved from ../.axproj (shared by all TME variants)

# List of CPU architecture to build that application with
# Available architectures (armeabi-v7a | arm64-v8a | x86 | x86_64)
# To build for multiple architecture, use the `:` between them
# Example - __1K_ARCHS=armeabi-v7a:arm64-v8a:x86
__1K_ARCHS=armeabi-v7a:arm64-v8a:x86:x86_64

# Extra CMake defines: any _1K_XXX property becomes -DXXX=value
_1K_TME=LOM

# uncomment it and fill in sign information for release mode
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password of keystore
#RELEASE_KEY_ALIAS=alias of key
#RELEASE_KEY_PASSWORD=password of key

android.injected.testOnly=false
android.useAndroidX=true

# Update AGP from 7.4.2 to 8.1.1
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
