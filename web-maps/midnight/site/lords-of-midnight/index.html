<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/map_lords_many.png">
<link rel="preload" href="assets/data.js" as="script">
<link rel="preload" href="assets/tiles.png" as="image">
<link rel="preload" href="assets/circle_selector.png" as="image">
<title>Lords of Midnight Map</title>
<meta name="description" content="Explore the Land of Midnight on the game&#x27;s own detailed map.">
<style>
/* Layout: the game's detailed map, full screen — scrolling tile map with fixed zoom controls top-left and filters top-right. */
@font-face { font-family: "Midnight"; src: url("assets/Midnight.woff") format("woff"); font-display: block; }
:root {
  --ground: #808080;          /* _clrGrey, the panel background in the game */
  --ink: #ffffff;              /* label text */
  --outline: #000000;          /* label outline */
  --halo: 255,255,255;         /* group popup glow */
  --focus: #be0005;            /* location ring red, used for keyboard focus */
  --field-bg: #ffffff;         /* search field */
  --field-ink: #000000;
  --field-muted: #5b5b66;
  --field-sel-bg: #000000;     /* highlighted match, inverted */
  --field-sel-ink: #ffffff;
  --field-sel-muted: #c8c8d0;
  --font-game: "Midnight", "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); overflow: hidden; font-family: var(--font-game);
  -webkit-user-select: none; user-select: none; touch-action: none; }
#stage { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }

#tooltip { position: fixed; left: 50%; top: calc(32px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -50%);
  font-size: 20px; line-height: 18px; color: var(--ink); text-align: center; pointer-events: none; white-space: nowrap;
  text-shadow: -2px -2px 0 var(--outline), 2px -2px 0 var(--outline), -2px 2px 0 var(--outline), 2px 2px 0 var(--outline),
               0 -2px 0 var(--outline), 0 2px 0 var(--outline), -2px 0 0 var(--outline), 2px 0 0 var(--outline);
  opacity: 0; transition: opacity 1s; max-width: calc(100vw - 280px); }
#tooltip.on { opacity: 1; }

button { appearance: none; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; display: block; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 50%; }

.zoom { position: fixed; left: calc(48px + env(safe-area-inset-left, 0px)); width: 64px; height: 64px;
  transform: translate(-50%, -50%); display: grid; place-items: center; }
.zoom .disc { position: absolute; inset: 0; width: 64px; height: 64px; pointer-events: none; }
.zoom button { position: relative; width: 32px; height: 32px; }
.zoom button img { width: 32px; height: 32px; display: block; }
.zoom button:active img { transform: scale(.9); }

#filters { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; }
.filter { position: relative; width: 73px; height: 67px; margin-bottom: -3px; }
.filter .art { position: absolute; left: 0; top: 3px; width: 64px; height: 64px; }
.filter .eye { position: absolute; left: 54px; top: 13px; width: 36px; height: 26px; transform: translate(-50%, -50%); }
.filter:focus-visible { border-radius: 8px; }

#group { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; pointer-events: none; opacity: 0; transition: opacity .15s; }
#group.on { opacity: 1; }
#group .glow { position: absolute; width: 384px; height: 384px; left: -192px; top: -192px; border-radius: 50%;
  background: radial-gradient(circle closest-side, rgba(var(--halo),.9) 60%, rgba(var(--halo),0) 100%); pointer-events: auto; }
#group .disc { position: absolute; width: 256px; height: 256px; left: -128px; top: -128px; pointer-events: none; }
#group .lord { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; pointer-events: auto; border-radius: 50%; }
#group .lord img { width: 48px; height: 48px; display: block; }
#group .lord span { position: absolute; left: 50%; top: 48px; transform: translate(-50%, -50%); font-size: 10px; white-space: nowrap;
  color: var(--ink); text-shadow: -1px -1px 0 var(--outline), 1px -1px 0 var(--outline), -1px 1px 0 var(--outline), 1px 1px 0 var(--outline); }
#group .lord:active img { transform: scale(.75); }
#group .disband { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; pointer-events: auto; }
#group .disband img { width: 32px; height: 32px; }

/* search: a round "?" button in the bottom-right corner that grows leftwards into a white pill field
   with a hard black edge; the button stays at the right end as the close control; matches open upwards */
#search { --fab: 56px; position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  transition: width .25s cubic-bezier(.2,.8,.2,1); }
#search.collapsed { width: var(--fab); }
#search .bar { position: relative; height: var(--fab); }
#search-input { position: absolute; inset: 0; width: 100%; height: var(--fab); box-sizing: border-box; margin: 0;
  font: 16px/1.2 var(--font-game); letter-spacing: .02em; padding: 0 calc(var(--fab) + 4px) 0 20px;
  border: 2px solid var(--field-ink); border-radius: calc(var(--fab) / 2); background: var(--field-bg); color: var(--field-ink);
  -webkit-user-select: text; user-select: text; box-shadow: 0 3px 0 rgba(0,0,0,.3); outline: none;
  transition: opacity .15s .1s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
#search-input::-webkit-search-cancel-button { display: none; }
#search-input::placeholder { color: var(--field-muted); }
#search-input:focus-visible { box-shadow: 0 0 0 2px var(--focus), 0 3px 0 rgba(0,0,0,.3); }
#search.collapsed #search-input { opacity: 0; pointer-events: none; transition: opacity .1s; }
#search-fab { position: absolute; right: 0; top: 0; width: var(--fab); height: var(--fab); border-radius: 50%;
  display: grid; place-items: center; box-sizing: border-box; border: 2px solid var(--field-ink);
  background: var(--field-bg); color: var(--field-ink); font: 30px/1 var(--font-game); box-shadow: 0 3px 0 rgba(0,0,0,.3);
  transition: background-color .15s, color .15s, box-shadow .15s; }
#search-fab .glyph { display: block; line-height: 1; }  /* nudged onto its ink centre by centreGlyph() */
#search-fab:hover { background: var(--field-sel-bg); color: var(--field-sel-ink); }
#search-fab:active { transform: scale(.94); }
#search:not(.collapsed) #search-fab { box-shadow: none; font-size: 26px; }
#results { position: absolute; left: 0; right: 0; bottom: 100%; margin: 0 0 6px; padding: 0; list-style: none;
  background: var(--field-bg); border: 2px solid var(--field-ink); max-height: min(60vh, 340px); overflow-y: auto; }
#results li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 12px;
  color: var(--field-ink); font-size: 15px; line-height: 1.25; cursor: pointer; }
#results li .name { min-width: 0; overflow-wrap: anywhere; }
#results li .tag { flex: none; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--field-muted); }
#results li[aria-selected="true"] { background: var(--field-sel-bg); color: var(--field-sel-ink); }
#results li[aria-selected="true"] .tag { color: var(--field-sel-muted); }
#results li.empty { color: var(--field-muted); cursor: default; }

@media (prefers-reduced-motion: reduce) { #tooltip, #group, #search, #search-input, #search-fab { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="map" aria-label="Detailed map" role="img"></canvas>
  <div id="group" aria-hidden="true"></div>
</div>
<div id="tooltip" role="status" aria-live="polite"></div>

<div class="zoom" style="top: calc(48px + env(safe-area-inset-top, 0px))"><img class="disc" alt=""><button id="zoom-out" title="Zoom out (Down arrow)"><img alt="Zoom out"></button></div>
<div class="zoom" style="top: calc(112px + env(safe-area-inset-top, 0px))"><img class="disc" alt=""><button id="zoom-reset" title="Reset zoom"><img alt="Reset zoom"></button></div>
<div class="zoom" style="top: calc(176px + env(safe-area-inset-top, 0px))"><img class="disc" alt=""><button id="zoom-in" title="Zoom in (Up arrow)"><img alt="Zoom in"></button></div>

<div id="filters"></div>

<form id="search" class="collapsed" role="search" autocomplete="off">
  <ul id="results" role="listbox" aria-label="Matches" hidden></ul>
  <div class="bar">
    <input id="search-input" type="search" placeholder="Find a lord, place or area" aria-label="Find a lord, place or area"
           role="combobox" aria-controls="results" aria-expanded="false" aria-autocomplete="list" spellcheck="false" enterkeyhint="search" tabindex="-1">
    <button type="button" id="search-fab" aria-controls="search-input" aria-expanded="false" aria-label="Search the map" title="Search the map (/)"><span class="glyph" aria-hidden="true">?</span></button>
  </div>
</form>

<script src="assets/data.js"></script>
<script>
(() => {
"use strict";
// ---------------------------------------------------------------- data
// window.MIDNIGHT_MAP comes from the data script build.py writes ahead of this one:
// { data: the map and its tables, images: frame name -> URL (a file, or a data: URI in a single-file build) }
const D = window.MIDNIGHT_MAP.data;
const SRC = window.MIDNIGHT_MAP.images;
const W = D.w, H = D.h, TILE = 64, SHEET_TILE = 128, SHEET_COLS = 16;

// the game's constants (panel_map_detailed.h, mapmodel.h, mapbuilder.cpp)
const MAP_SCALE_MAX = 2.0, MAP_SCALE_CLICK_DELTA = 0.1, INITIAL_MAP_SCALE = 1.0;
const SCROLL_TO_LORD_SECS = 1.0;
const CELL_BLANK = 3 * 16 + 1;
const DENSITY_MAPPING = [10, 6, 11, 7, 14, 2, 15, 3, 9, 5, 8, 4, 13, 1, 12, 0];
const REMAP_DENSITY = x => Math.floor(x / 4) * 16 + (x % 4);
const OB_WILDHORSES = D.critterMax;
const LF_DOMAIN = 1, LF_STRONGHOLD = 256;
const PLACE_TERRAINS = new Set(D.placeTerrains);
const LF_TUNNEL = 2, LF_TUNNEL_ENDS = 32 | 64;
const CELL_FIRST_TUNNEL = 0 * 16 + 13, CELL_FIRST_TUNNEL_END = 0 * 16 + 9;
const GROUP_RADIUS = 95, GROUP_STEPS = 10, DISBAND_BUTTON_POSITION = 8.5, MAX_VISIBLE_LORDS = 8;

const img = {};
const loads = Object.entries(SRC).map(([k, src]) => new Promise(res => {
  const i = new Image(); i.onload = () => res(); i.onerror = () => res(); i.src = src; img[k] = i;
}));

// ---------------------------------------------------------------- mapbuilder (debug map: everything seen)
const idx = (x, y) => y * W + x;
const terrainLayer = new Uint16Array(W * H);
const critterLayer = new Uint16Array(W * H);
const tunnelLayer = new Uint16Array(W * H);

for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const t = D.terrain[idx(x, y)];
  // updateDensityMap: a neighbour of different terrain, or the map edge, counts
  let d = 0;
  d += (y > 0 ? D.terrain[idx(x, y - 1)] !== t : true) ? 1 : 0;
  d += (y < H - 1 ? D.terrain[idx(x, y + 1)] !== t : true) ? 4 : 0;
  d += (x > 0 ? D.terrain[idx(x - 1, y)] !== t : true) ? 8 : 0;
  d += (x < W - 1 ? D.terrain[idx(x + 1, y)] !== t : true) ? 2 : 0;
  const density = REMAP_DENSITY(DENSITY_MAPPING[d]);
  // updateLayers
  const info = D.terrainCells[t];
  terrainLayer[idx(x, y)] = !info ? CELL_BLANK : info.density ? info.cell + density : info.cell;
  const thing = D.things[idx(x, y)];
  if (thing && thing <= OB_WILDHORSES && D.objectCells[thing]) critterLayer[idx(x, y)] = D.objectCells[thing];

  // tunnels (DDR): density counts the neighbours that are tunnel too, with no edge default
  const isTunnel = (x, y) => (D.flags[idx(x, y)] & LF_TUNNEL) !== 0;
  if (isTunnel(x, y)) {
    let td = 15;
    if (y > 0 && isTunnel(x, y - 1)) td -= 1;
    if (y < H - 1 && isTunnel(x, y + 1)) td -= 4;
    if (x > 0 && isTunnel(x - 1, y)) td -= 8;
    if (x < W - 1 && isTunnel(x + 1, y)) td -= 2;
    const tunnel = DENSITY_MAPPING[td];
    // a square with one tunnel neighbour can be an end: 0 left, 1 top, 2 right, 3 bottom
    const end = tunnel === 1 ? 0 : tunnel === 4 ? 1 : tunnel === 3 ? 2 : tunnel === 12 ? 3 : -1;
    if (D.flags[idx(x, y)] & LF_TUNNEL_ENDS) { if (end !== -1) tunnelLayer[idx(x, y)] = CELL_FIRST_TUNNEL_END + end; }
    else tunnelLayer[idx(x, y)] = CELL_FIRST_TUNNEL + REMAP_DENSITY(tunnel);
  }
}
const HAS_TUNNELS = tunnelLayer.some(v => v);
// DDR places its creatures at random when a game starts, so its map file has none to show
const HAS_CRITTERS = critterLayer.some(v => v);

// ---------------------------------------------------------------- location text (processor_text.cpp)
const TI = D.terrainInfo, AR = D.areas, S = D.strings;
const isPlural = t => (TI[t]?.flags || "").split("+").includes("PLURAL");
function cook(text, t, a) {
  return text.replace(/\{([^}]+)\}/g, (m, tok) => {
    const p = tok.split(":");
    if (p[0] === "str") return cook(D.stringsById[p[1]] ?? "", t, a);
    if (p[0] === "terrain") {
      const ti = TI[t] || { name: "", desc: "" };
      if (p[1] === "name") return ti.name;
      if (p[1] === "plural") return isPlural(t) ? cook(S.SS_TERRAIN_PLURAL, t, a) : ti.name;
      if (p[1] === "single") return cook(isPlural(t) ? S.SS_TERRAIN_PLURAL : S.SS_TERRAIN_SINGLE, t, a);
      if (p[1] === "text") return cook(ti.desc, t, a);
    }
    if (p[0] === "area") {
      const ar = AR[a] || { name: "", prefix: "" };
      if (p[1] === "name") return ar.name;
      if (p[1] === "prefix") return ar.prefix;
      if (p[1] === "text") return ar.prefix ? cook(S.SS_AREA_PREFIXED, t, a) : ar.name;
    }
    return "";
  });
}
function locationText(x, y) {
  const i = idx(x, y), t = D.terrain[i], a = D.area[i];
  return cook((D.flags[i] & LF_DOMAIN) ? S.SS_LOCATION_DOMAIN : S.SS_LOCATION_NOTDOMAIN, t, a);
}

// ---------------------------------------------------------------- lords, groups, places
const lords = D.characters.filter(c => c.face && !(c.x === 0 && c.y === 0));
const CURRENT = lords.find(c => c.symbol === D.current) || lords[0];
const byLoc = new Map();
for (const c of lords) { const k = c.x + "," + c.y; if (!byLoc.has(k)) byLoc.set(k, []); byLoc.get(k).push(c); }
const markers = [...byLoc.values()].map(group => ({ x: group[0].x, y: group[0].y, lords: group, many: group.length > 1 }));
// singles in map order (a lower lord covers the one above), the current lord over the others, groups over all
markers.sort((a, b) => {
  const za = a.many ? 1e6 : a.lords[0] === CURRENT ? 1e5 : a.y, zb = b.many ? 1e6 : b.lords[0] === CURRENT ? 1e5 : b.y;
  return za - zb;
});

const places = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = idx(x, y), f = D.flags[i], t = D.terrain[i];
  if (((f & LF_STRONGHOLD) && !(f & LF_DOMAIN)) || PLACE_TERRAINS.has(t)) {
    // the game drops the label where a lord stands (setupPlaceLabels: CONTINUE_IF(!m->here.empty()));
    // here that is decided as the map draws, so the name comes back when the lords filter is off
    places.push({ x, y, name: locationText(x, y), occupied: byLoc.has(x + "," + y) });
  }
}

// ---------------------------------------------------------------- view model
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
canvas.setAttribute("aria-label", "Detailed map of " + D.land);
// the page opens on the bare map: every filter starts off
const filters = { centre: false, critters: false, lords: false, tunnels: false };
const layerAlpha = { critters: 0, lords: 0, tunnels: 0 };
let vw = 0, vh = 0, dpr = 1;
let scale = INITIAL_MAP_SCALE, minScale = 0.5;
let ox = 0, oy = 0;          // screen position of the map's top-left
let dirty = true;
const mapW = W * TILE, mapH = H * TILE;

function fitScale() { return Math.min(vw / mapW, vh / mapH); }
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  vw = canvas.clientWidth; vh = canvas.clientHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  // the game stops at the scale that fills the screen; here that is the whole land, so all of it can be seen at once
  minScale = Math.min(INITIAL_MAP_SCALE, Math.max(0.1, Math.min(0.5, fitScale())));
  scale = Math.max(minScale, scale);
  clampOffset(); dirty = true;
}
function clampOffset() {
  const sw = mapW * scale, sh = mapH * scale;
  ox = sw <= vw ? (vw - sw) / 2 : Math.min(0, Math.max(vw - sw, ox));
  oy = sh <= vh ? (vh - sh) / 2 : Math.min(0, Math.max(vh - sh, oy));
}
const toMap = (sx, sy) => ({ x: (sx - ox) / scale, y: (sy - oy) / scale });

// ---------------------------------------------------------------- drawing
function drawTile(gid, x, y) {
  if (!gid) return;
  const s = gid - 1;
  ctx.drawImage(img.tiles, (s % SHEET_COLS) * SHEET_TILE, Math.floor(s / SHEET_COLS) * SHEET_TILE, SHEET_TILE, SHEET_TILE,
    x * TILE, y * TILE, TILE, TILE);
}
function outlined(text, x, y, size, outline) {
  ctx.font = `${size}px Midnight, sans-serif`;
  ctx.lineJoin = "round"; ctx.lineWidth = outline * 2; ctx.strokeStyle = "#000"; ctx.fillStyle = "#fff";
  ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
}
function wrap(text, size, width) {
  ctx.font = `${size}px Midnight, sans-serif`;
  const words = text.split(" "), lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (line && ctx.measureText(test).width > width) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// labels are bottom aligned in their box, so wrapped lines grow upwards
function label(text, cx, bottom, size, width, maxLines, outline) {
  let lines = wrap(text, size, width);
  if (lines.length > maxLines) lines = lines.slice(lines.length - maxLines);
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  const lh = size;
  lines.forEach((l, i) => outlined(l, cx, bottom - (lines.length - 1 - i) * lh - size * 0.18, size, outline));
}

function draw() {
  dirty = false;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";

  // white under the tiles, so no grey hairlines show between them at fractional zoom
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, mapW, mapH);

  const a = toMap(0, 0), b = toMap(vw, vh);
  const x0 = Math.max(0, Math.floor(a.x / TILE)), y0 = Math.max(0, Math.floor(a.y / TILE));
  const x1 = Math.min(W - 1, Math.floor(b.x / TILE)), y1 = Math.min(H - 1, Math.floor(b.y / TILE));

  // Terrain layer
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(terrainLayer[idx(x, y)], x, y);
  // Critters layer
  if (layerAlpha.critters > 0) {
    ctx.globalAlpha = layerAlpha.critters;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(critterLayer[idx(x, y)], x, y);
    ctx.globalAlpha = 1;
  }
  // Tunnels layer
  if (HAS_TUNNELS && layerAlpha.tunnels > 0) {
    ctx.globalAlpha = layerAlpha.tunnels;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(tunnelLayer[idx(x, y)], x, y);
    ctx.globalAlpha = 1;
  }
  // selected area: grey out every other square and outline the area's border
  if (areaSel) {
    ctx.fillStyle = "rgba(128,128,128,.6)";
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
      if (!areaSel.mask[idx(x, y)]) ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    ctx.strokeStyle = "#be0005"; ctx.lineWidth = Math.max(3, 2 / scale); ctx.lineCap = "round";
    ctx.stroke(areaSel.border);
  }
  // place names (setupPlaceLabels): small font, 128 wide, bottom of the square
  for (const p of places) {
    if (p.x < x0 - 1 || p.x > x1 + 1 || p.y < y0 - 1 || p.y > y1 + 1) continue;
    // a lord's square shows its name only while the lords are hidden (fading across as the layer fades)
    const a = p.occupied ? 1 - layerAlpha.lords : 1;
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    // the game's label box is two lines tall but does not clip, so longer names grow upwards
    label(p.name, p.x * TILE + 32, p.y * TILE + 64, 12, 128, 4, 1);
    ctx.globalAlpha = 1;
  }
  // lords (setupCharacterButtons)
  if (layerAlpha.lords > 0) {
    ctx.globalAlpha = layerAlpha.lords;
    for (const m of markers) {
      if (m.x < x0 - 1 || m.x > x1 + 1 || m.y < y0 - 1 || m.y > y1 + 1) continue;
      const cx = m.x * TILE + 32, cy = m.y * TILE + 32;
      if (m === openGroup) continue;
      if (m.many) {
        ctx.drawImage(img.map_lords_many, cx - 32, cy - 32, 64, 64);
      } else {
        const c = m.lords[0];
        ctx.drawImage(img[c.face], cx - 32, cy - 32, 64, 64);
        label(c.name, cx, cy + 32, 12, 124, 3, 1);
      }
    }
    ctx.globalAlpha = 1;
  }
  // a lord found by the search: a red ring that pulses on their square for a few seconds
  if (flash) {
    const t = performance.now() - flash.start;
    if (t > FLASH_MS) flash = null;
    else {
      const k = (t % 800) / 800, cx = flash.x * TILE + 32, cy = flash.y * TILE + 32;
      ctx.strokeStyle = "#be0005";
      ctx.lineWidth = 4;
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(cx, cy, 36 + k * 28, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 36, 0, Math.PI * 2); ctx.stroke();

  else if (e.key === "Escape") { if (!closeGroup()) clearArea(); }
});

// ---------------------------------------------------------------- start
window.addEventListener("resize", () => { resize(); if (filters.centre) centreOn(CURRENT, false); });
Promise.all([...loads, document.fonts.load("20px Midnight").catch(() => {})]).then(() => {
  wireZoom(); wireFilters(); centreGlyph();
  resize();
  centreOn(CURRENT, false);
  dirty = true;
  requestAnimationFrame(frame); requestAnimationFrame(tick);
});
})();
</script>
